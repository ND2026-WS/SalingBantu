<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cari Bantuan — Saling Bantu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'%3E%3Cpath d='M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="cari">
  <div id="app-header"></div>

  <main class="section" style="padding-top:36px">
    <div class="container">
      <div class="section-head" style="margin-bottom:24px">
        <span class="eyebrow">Cari Bantuan</span>
        <h2>Temukan Pengajuan yang Perlu Dibantu</h2>
        <p>Semua pengajuan telah diverifikasi admin. Gunakan filter kategori dan lokasi untuk menemukan yang terdekat dengan hatimu.</p>
      </div>

      <div class="filter-bar" style="margin-bottom:22px">
        <input type="text" id="f-q" placeholder="Cari kata kunci: sekolah, pengobatan, sembako..."/>
        <select id="f-kategori">
          <option value="">Semua Kategori</option>
        </select>
        <input type="text" id="f-lokasi" placeholder="Kota / provinsi..."/>
        <button class="btn btn-primary" id="btn-cari"><span></span> Cari</button>
        <button class="btn btn-ghost" id="btn-reset">Reset</button>
      </div>

      <p style="color:var(--abu);font-size:13.5px;margin-bottom:14px" id="info-jumlah"></p>
      <div class="grid grid-3" id="hasil-grid"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="toast-wrap"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/konten.js"></script>
  <script src="js/main.js"></script>
  <script src="js/kartu.js"></script>
  <script src="js/cari.js"></script>
</body>
</html>
